<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student profile</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body style="background-color: rgb(30 ,30 ,30);">

    <h1 class="display-3 text-center text-white">student profile</h1>

      Learning never exhausts the mind.
    </blockquote>
    <img src="Iphone Wallpaper.jpg" alt="profile" class="rounded-circle mx-auto d-block" height="600px" width="400px"><br><br>
    <table class="table table-bordered table-striped">
        <thead class="thead-dark">
             <tr>
                <th>subject</th>
                <th>mark</th>
             </tr>
        </thead>
        <tbody class="text-white">
            <tr>
                <td>english</td>
                <td>95</td>
            </tr>
            <tr>
            <td>maths</td>
            <td>93</td> 
            </tr>
            <tr>
                <td>science</td>
                <td>97</td>
            </tr>            
        </tbody>
    </table><br>
    <div class="alert alert-success alert-dismissible"><strong>profile updated successfully!</strong>
    <button type="button" class="close" data-dismiss="alert">&times;</button>
    </div>
    </div>
    
</body>
</html>
